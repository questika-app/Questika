<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Newsreader:wght@500&family=Nunito:wght@600;700;800;900&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2257;--sub:#8c88a8;--pri:#7c4dff;--pri2:#5b2fe0;--card:#f6f4fd;--chip:#ece8fb;--xp:#ede6fb;--bg:#eceafa;box-sizing:border-box}
:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#d9d6ef;font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.phone{position:relative;width:430px;flex:none;min-height:100vh;background:linear-gradient(#cfdcf7,#e3e6fa 300px,#efedfb);overflow:hidden}
.hero{position:absolute;inset:0 0 auto 0;height:320px;background:linear-gradient(#bcd0f5 0%,#d6e1f8 45%,#e8e8fa 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.status{position:absolute;top:14px;left:22px;right:22px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;z-index:3}
.status i{display:inline-block;width:24px;height:12px;border-radius:4px;background:#111;margin-left:6px;vertical-align:-1px}
.hud{position:absolute;top:36px;left:20px;right:12px;z-index:3;height:60px}
.avatar{position:absolute;left:0;top:3px;width:48px;height:48px;border-radius:50%;border:2px solid #a58df0;background:#f3e9ff;overflow:hidden;box-shadow:0 0 0 2px #fff6}
.avatar svg{width:100%;height:100%}
.lv{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);background:#7c4dff;color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px}
.name{position:absolute;left:63px;top:0;font-weight:800;font-size:16px}
.bar{position:absolute;left:63px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;width:150px}
.bar .t{position:absolute;left:19px;top:0}
.bar .tr{position:absolute;left:18px;right:0;bottom:-6px;height:4px;border-radius:3px}
.hp{top:26px}.hp .tr{background:#f7b9c6}.hp .tr b{display:block;height:100%;width:55%;background:#ef3f6d;border-radius:3px}
.en{top:48px}.en .tr{background:#bcd0f8}.en .tr b{display:block;height:100%;width:100%;background:#4d8bf2;border-radius:3px}
.pills{position:absolute;right:0;top:2px;display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:#ffffffb8;backdrop-filter:blur(6px);border-radius:20px;padding:0 12px 0 8px;height:30px;font-weight:800;font-size:13px;box-shadow:0 2px 8px #7c4dff14}
.pill i{width:16px;height:16px;border-radius:50%;display:block}
.bubble{position:absolute;left:184px;top:89px;width:122px;background:#ffffffc9;border-radius:22px;padding:11px 16px;font-size:13px;font-weight:600;line-height:1.3;z-index:3}
.bubble:after{content:"";position:absolute;left:22px;bottom:-14px;border:10px solid transparent;border-top:16px solid #ffffffc9;border-bottom:0;border-right:0}
.sheet{position:absolute;left:0;right:0;top:280px;bottom:0;background:linear-gradient(#f6f4fe,#f0eefb);border-radius:42px 42px 0 0;box-shadow:0 -4px 24px #7c4dff14;padding:26px 14px 0;z-index:4}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px 14px}
.head h1{font-size:25px;font-weight:800}
.date{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;height:44px;padding:0 14px 0 10px;font-weight:700;font-size:16px;box-shadow:0 3px 12px #7c4dff14;margin-right:0}
.day{font-weight:800;font-size:15px;color:#9b86d8;margin:14px 0 8px 2px}
.task{background:#fbfaff;border-radius:20px;padding:14px 14px 12px;margin-bottom:8px;box-shadow:0 3px 14px #7c4dff0f;position:relative;display:grid;grid-template-columns:30px 1fr auto;column-gap:12px}
.chk{width:28px;height:28px;border-radius:50%;border:2.5px solid #a99de0;margin-top:2px}
.ttl{font-weight:800;font-size:18px;line-height:1.2}
.ttl.s{font-size:16px}
.sb{font-size:14px;color:#8e8aa9;font-weight:600;margin-top:3px}
.right{display:flex;align-items:center;gap:8px}
.xp{display:flex;align-items:center;gap:5px;background:var(--xp);color:#4a2fb5;border-radius:16px;height:34px;padding:0 13px 0 9px;font-weight:800;font-size:15px}
.dots{width:4px;display:flex;flex-direction:column;gap:3px;padding:0 6px}
.dots i{width:4px;height:4px;border-radius:50%;background:#7a6fb3;display:block}
.meta{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:#7e75b3;font-size:14px;font-weight:700}
.meta .l{display:flex;gap:14px;align-items:center}
.meta span{display:flex;align-items:center;gap:5px}
.folder{background:var(--chip);color:#7a72a6;border-radius:12px;height:30px;padding:0 12px 0 8px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.fab{position:absolute;right:16px;bottom:128px;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#8f63ff,#5b2fe0);box-shadow:0 8px 20px #6a3df066;display:flex;align-items:center;justify-content:center;z-index:6}
.nav{position:absolute;left:18px;bottom:30px;width:300px;height:56px;background:#fffffff0;border-radius:30px;box-shadow:0 6px 20px #7c4dff1a;display:flex;align-items:center;padding:0 16px 0 16px;gap:0;z-index:6;justify-content:space-between}
.nav div{width:68px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.nav .on{background:#e9e3fb;width:70px;margin-left:-0px}
.me{position:absolute;right:16px;bottom:28px;width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 18px #7c4dff26;z-index:6;overflow:visible}
.me .avatar{position:absolute;inset:0;width:100%;height:100%;border:2px solid #b7a3f5}
.me .lv{font-size:11px;padding:1px 8px;bottom:0}
svg.ic{width:22px;height:22px;stroke:#7a5fe0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.phone{height:932px;min-height:0}
.status{top:11px;font-size:14px;font-weight:700}
.hud{top:39px;right:21px;height:50px}
.avatar{width:49px;height:49px;top:0;box-shadow:0 2px 8px rgba(124,77,255,.18)}
.lv{font-size:7.5px;padding:1px 5px;border-radius:7px;font-weight:700}
.name{top:0;font-size:13px;font-weight:500;line-height:16px}
.bar{height:14px;line-height:14px;width:90px;font-size:9px;font-weight:400}
.bar svg{width:12px;height:12px}
.bar .t{left:15px;top:0}
.bar .tr{left:15px;height:3px;bottom:-4px}
.hp{top:18px}.en{top:36px}
.pills{right:0;top:1px;gap:6px}
.pill{height:29px;padding:0 10px 0 7px;font-size:13px;font-weight:700;gap:4px;background:rgba(255,255,255,.72);box-shadow:0 1px 6px rgba(124,77,255,.10)}
.pill i{width:15px;height:15px}.pill svg{height:14px;width:auto}
.bubble{left:186px;top:90px;width:123px;height:46px;padding:0 0 0 14px;display:flex;align-items:center;font-size:10.5px;font-weight:500;line-height:1.3;border-radius:16px;background:rgba(255,255,255,.78)}
.bubble:after{left:19px;bottom:-12px;border-width:8px;border-top-width:13px;border-top-color:rgba(255,255,255,.78)}
.sheet{top:283px;border-radius:30px 30px 0 0;padding:19px 14px 0;background:linear-gradient(#f6f4fd,#f1effb);box-shadow:0 -3px 18px rgba(124,77,255,.08)}
.head{margin:0 3px 0 14px;height:30px}
.head h1{font-size:20px;font-weight:700}
.date{width:130px;height:30px;border-radius:12px;padding:0 10px 0 8px;font-size:11px;font-weight:500;gap:6px;box-shadow:0 2px 8px rgba(124,77,255,.08)}
.date .ic{width:14px;height:14px}.date svg:last-child{margin-left:auto;width:6px;height:8px}
.day{font-size:12.5px;font-weight:500;line-height:14px;color:#a99bd8;margin:19px 0 11px 6px}
.task{grid-template-columns:20px 1fr auto;column-gap:14px;padding:12px 14px 10px 10px;border-radius:20px;margin-bottom:2.5px;background:#f9f8fe;box-shadow:0 2px 10px rgba(124,77,255,.07)}
.task:last-child{padding-bottom:6px}.task:last-child .meta{margin-top:15px}
.chk{width:20px;height:20px;border-width:1.5px;margin-top:-1px;border-color:#aca0e2}
.ttl{font-size:13.5px;font-weight:500;line-height:18px}.ttl.s{font-size:12px;white-space:nowrap}
.sb{font-size:10.5px;line-height:14px;margin-top:1px;font-weight:400;color:#9a97b5}
.right{margin-top:-1px;gap:14px;align-self:start}
.xp{height:24px;border-radius:12px;padding:0 10px 0 7px;font-size:10.5px;font-weight:700;gap:4px}.xp svg{width:13px;height:13px}
.dots{width:3px;padding:0;gap:3px}.dots i{width:3px;height:3px}
.meta{font-size:10.5px;font-weight:500;color:#8b83b8;margin-top:5px}
.meta span{gap:3px}.meta .l{gap:9px}
.meta .ic{width:12px!important;height:12px!important;stroke-width:1.8}
.folder{height:19px;border-radius:8px;padding:0 8px 0 5px;font-size:10px;font-weight:500;gap:4px;margin-right:3px;background:#ebe7f9;color:#8a84ad}
.fab{right:17px;bottom:122px;box-shadow:0 6px 16px rgba(110,60,240,.35)}.fab svg{width:18px;height:18px}
.nav{left:18px;bottom:42px;width:302px;height:54px;border-radius:27px;padding:0 0 0 16px;justify-content:flex-start;background:rgba(255,255,255,.78);box-shadow:0 4px 16px rgba(124,77,255,.10)}
.nav div{width:68px;height:34px;border-radius:17px}.nav .on{width:69px}
.nav .ic{width:25px!important;height:25px!important}
.me{right:21px;bottom:35px;width:72px;height:72px;border-width:3px;box-shadow:0 4px 16px rgba(124,77,255,.18)}
.me .lv{font-size:8px}
